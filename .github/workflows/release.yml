name: Release

on:
  push:
    tags: ["v*"]
  # A PR touching the pipeline builds and packages without publishing, so a
  # broken release is caught before the tag rather than after.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - scripts/render-formula.sh
      - packaging/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "metrognome-cli") | .version')
          if [[ $GITHUB_REF == refs/tags/* && ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p metrognome-cli --target "$target"
          done
      - name: Package
        id: package
        run: |
          tarball=$(scripts/package-release.sh "${{ steps.version.outputs.version }}" dist)
          echo "sha256=$(cut -d' ' -f1 "$tarball.sha256")" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        # The runner is Apple Silicon, so this runs the arm64 slice of what ships.
        run: |
          tar -xzf dist/*.tar.gz -C dist
          bin=$(echo dist/metrognome-*/metrognome)
          "$bin" --version | grep -F "${{ steps.version.outputs.version }}"
          codesign --verify "$bin"
          "$bin" selftest > /dev/null
      - name: Render formula
        run: scripts/render-formula.sh "${{ steps.version.outputs.version }}" "${{ steps.package.outputs.sha256 }}" | ruby -c
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  tap:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for tap token
        id: token
        run: |
          if [[ -z $TAP_TOKEN ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the tap was not updated"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present
        uses: actions/checkout@v4
        with:
          repository: Jonas-Ross/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        if: steps.token.outputs.present
        run: |
          mkdir -p tap/Formula
          scripts/render-formula.sh "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.sha256 }}" > tap/Formula/metrognome.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/metrognome.rb
          git commit -m "metrognome ${{ needs.build.outputs.version }}"
          git push
