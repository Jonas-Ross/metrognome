name: Merge gate on review

# Jonas's review changes the gate's answer, so re-run the gate job of the
# latest CI run on the PR's head instead of the whole suite.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  rerun:
    # A plain comment changes no approval; threads posting as Jonas make many.
    if: github.event.review.user.login == 'Jonas-Ross' && (github.event.action == 'dismissed' || github.event.review.state != 'commented')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A gate that read the reviews before this one can still pass; turning
      # auto-merge off now stops that pass from merging.
      - if: github.event.action == 'dismissed' || github.event.review.state == 'changes_requested'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTO: ${{ github.event.pull_request.auto_merge != null }}
        run: |
          if [ "$AUTO" = true ]; then gh pr merge --disable-auto "$PR_URL"; fi
      - env:
          # GITHUB_TOKEN gets a 403 re-running a job, so this needs a fine-grained
          # token with Actions read/write on this repository.
          GH_TOKEN: ${{ secrets.MERGE_GATE_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::MERGE_GATE_TOKEN is not set; re-run the gate job by hand to pick up this review"
            exit 0
          fi
          run=$(gh run list -R "$REPO" --workflow ci.yml --event pull_request --commit "$SHA" \
            --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$run" ] || { echo "no CI run on $SHA yet; its gate reads the review when it runs"; exit 0; }
          # A gate still running may have read the reviews before this one landed.
          # Polled, not `gh run watch`, which needs checks:read that a fine-grained
          # token cannot have.
          until [ "$(gh run view "$run" -R "$REPO" --json status --jq .status)" = completed ]; do
            sleep 20
          done
          job=$(gh run view "$run" -R "$REPO" --json jobs --jq '.jobs[] | select(.name == "gate") | .databaseId')
          gh run rerun "$run" -R "$REPO" --job "$job"
