[workspace]
members = ["crates/metrognome", "crates/metrognome-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jonas-Ross/metrognome"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "io-util"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
